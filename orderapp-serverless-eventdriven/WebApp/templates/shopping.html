<!DOCTYPE html>
<html>
<head>
  <title>Product Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script>
    let cart = [];

    function addToCart(id, name, price, maxQty) {
      const qty = parseInt(prompt(`Enter quantity for ${name} (max: ${maxQty})`, "1"));
      if (!qty || qty <= 0 || qty > maxQty) {
        alert("Invalid quantity.");
        return;
      }

      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ id, name, price, qty });
      }

      updateCart();
    }

    function updateCart() {
      const list = document.getElementById("cart-items");
      list.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const li = document.createElement("li");
        li.classList.add("list-group-item");
        li.textContent = `${item.name} × ${item.qty} = ₹${item.qty * item.price}`;
        list.appendChild(li);
        total += item.qty * item.price;
      });

      document.getElementById("total").innerText = "Total: ₹" + total;
    }

    async function submitOrder() {
      const customer_id = document.getElementById("customer_id").value;
      const email_id = document.getElementById("email_id").value;
      const payment_amount = document.getElementById("payment_amount").value;
      const messageElem = document.getElementById("message");

      if (!customer_id || !email_id || cart.length === 0) {
        alert("Fill user info and add at least one item.");
        return;
      }

      document.getElementById("submit-btn").disabled = true;
      document.getElementById("submit-btn").innerText = "Submitting...";

      const response = await fetch("/submit_order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ customer_id, email_id, payment_amount, cart })
      });

      const result = await response.json();

      messageElem.innerText = result.message;
      cart = [];
      updateCart();

      document.getElementById("submit-btn").disabled = false;
      document.getElementById("submit-btn").innerText = "Submit Order";
    }

    function continueShopping() {
      cart = [];
      updateCart();

      document.getElementById("customer_id").value = "";
      document.getElementById("email_id").value = "";
      document.getElementById("payment_amount").value = "";
      document.getElementById("message").innerText = "";
    }
  </script>
</head>

<body class="container mt-4">
  <h1 class="mb-4">🛒 Serverless Product Ordering Learning Project</h1>

  <div class="row mb-3">
    <div class="col-md-4 mb-2">
      <label class="form-label">Customer Name</label>
      <input id="customer_id" class="form-control" />
    </div>
    <div class="col-md-4 mb-2">
      <label class="form-label">Email</label>
      <input id="email_id" class="form-control" />
    </div>
    <div class="col-md-4 mb-2">
      <label class="form-label">Payment Amount</label>
      <input id="payment_amount" class="form-control" />
    </div>
  </div>

  <h3>📦 Products</h3>
  <ul class="list-group mb-4">
    {% for p in products %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ p.product_name }}</strong> (ID: {{ p.product_id }}) — ₹{{ p.price }}
        </div>
        <button
          class="btn btn-sm btn-primary"
          onclick="addToCart('{{ p.product_id }}', '{{ p.product_name }}', {{ p.price }}, {{ p.quantity }})"
        >
          Add to Cart
        </button>
      </li>
    {% endfor %}
  </ul>

  <h3>🛍️ Cart</h3>
  <ul class="list-group mb-2" id="cart-items"></ul>
  <h5 id="total">Total: ₹0</h5>

  <button class="btn btn-success mt-3 me-2" id="submit-btn" onclick="submitOrder()">Submit Order</button>
  <button class="btn btn-secondary mt-3" onclick="continueShopping()">Continue Shopping</button>
  <button class="btn btn-secondary mt-3" onclick="window.location.href='/register.html'">Register</button>
  <a href="/" class="btn btn-secondary mt-3">← Back to Home</a>

  <p id="message" class="mt-3 fw-bold text-success"></p>
</body>
</html>
