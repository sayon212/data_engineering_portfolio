<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #f0f8ff, #e6ffe6);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background-color: #ffffff;
      border-radius: 1rem;
      border: none;
    }
    .form-control {
      border-radius: 0.75rem;
    }
    .btn-success {
      background-color: #28a745;
      border-radius: 0.75rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .btn-outline-secondary,
    .btn-outline-primary {
      border-radius: 0.75rem;
      padding: 0.5rem 1.2rem;
    }
    .btn-outline-secondary:hover {
      background-color: #6c757d;
      color: #fff;
    }
    .btn-outline-primary:hover {
      background-color: #0d6efd;
      color: #fff;
    }
    h2 {
      font-weight: 600;
      color: #333;
    }
    label {
      font-weight: 500;
    }
    #message {
      text-align: center;
      font-size: 1rem;
    }
  </style>
  <script>
    async function submitForm(event) {
      event.preventDefault();

      const customer_name = document.getElementById("customer_name").value.trim();
      const email_id = document.getElementById("email_id").value.trim();
      const location = document.getElementById("location").value.trim();
      const messageElem = document.getElementById("message");

      if (!customer_name || !email_id || !location) {
        messageElem.innerText = "❌ All fields are required.";
        messageElem.className = "text-danger fw-bold mt-3";
        return;
      }

      const payload = { customer_name, email_id, location };

      try {
        const response = await fetch("/register_customer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          messageElem.innerText = "✅ " + result.message;
          messageElem.className = "text-success fw-bold mt-3";
        } else {
          messageElem.innerText = "❌ " + (result.message || "Registration failed.");
          messageElem.className = "text-danger fw-bold mt-3";
        }
      } catch (error) {
        console.error(error);
        messageElem.innerText = "❌ Server error.";
        messageElem.className = "text-danger fw-bold mt-3";
      }
    }
  </script>
</head>
<body class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">📝 Customer Registration</h2>
          <form onsubmit="submitForm(event)">
            <div class="mb-3">
              <label for="customer_name" class="form-label">👤 Customer Name</label>
              <input type="text" class="form-control" id="customer_name" placeholder="Enter full name" required />
            </div>
            <div class="mb-3">
              <label for="email_id" class="form-label">📧 Email Address</label>
              <input type="email" class="form-control" id="email_id" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
              <label for="location" class="form-label">📍 Location</label>
              <input type="text" class="form-control" id="location" placeholder="City or Area" required />
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">✅ Submit Registration</button>
            <p id="message" class="mt-3"></p>
          </form>
        </div>
      </div>
      <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="/" class="btn btn-outline-secondary">← Back to Home</a>
        <a href="/shopping" class="btn btn-outline-primary">🛒 Go to Shopping</a>
      </div>
    </div>
  </div>
</body>
</html>
